<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowPost Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/static/styles.css?v=__V__">
<style>
  .adm-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 10px; }
  .adm-head h1 { font-size: 20px; margin: 0; }
  .adm-count { color: var(--muted); font-size: 13px; }
  .adm-search, .adm-input, .adm-select, .adm-note {
    width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 12px; outline: none;
  }
  .adm-search:focus, .adm-input:focus, .adm-select:focus, .adm-note:focus { border-color: var(--accent); }
  .adm-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 24px; }
  .adm-card {
    text-align: left; width: 100%; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px;
  }
  .adm-card:active { background: var(--surface-active); }
  .adm-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .adm-title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-sub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-badge { flex: none; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--field); color: var(--text-soft); }
  .adm-badge.trial { background: rgba(139, 141, 216, .2); color: var(--accent-2); }
  .adm-badge.paid { background: rgba(80, 200, 120, .16); color: #7fdc9f; }
  .adm-badge.none { background: rgba(240, 90, 90, .16); color: #f28b8b; }
  .adm-badge.unlimited { background: rgba(255, 201, 60, .16); color: var(--gold); }
  .adm-quotas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .adm-q { background: var(--field); border-radius: 10px; padding: 6px 4px; text-align: center; }
  .adm-q b { display: block; font-size: 15px; }
  .adm-q span { font-size: 11px; color: var(--muted); }
  .adm-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .adm-section h2 { font-size: 15px; margin: 0 0 10px; }
  .adm-kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .adm-kv:first-of-type { border-top: 0; }
  .adm-kv span:first-child { color: var(--muted); }
  .adm-kv span:last-child { text-align: right; }
  .adm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .adm-field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px 2px; }
  .adm-note { min-height: 64px; resize: vertical; font: inherit; }
  .adm-check { display: flex; align-items: center; gap: 8px; margin: 12px 2px; font-size: 14px; }
  .adm-actions { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 28px; }
  .adm-btn {
    height: 46px; border-radius: 14px; border: 0; font-weight: 650; cursor: pointer;
    background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff;
  }
  .adm-btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .adm-btn:disabled { opacity: .5; }
  .adm-empty { color: var(--muted); text-align: center; padding: 28px 0; }
  .adm-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .adm-chip { border: 1px solid var(--border); background: var(--field); color: var(--text-soft); border-radius: 999px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body data-app="admin">
<div class="app">
  <main id="view"></main>
</div>
<script src="/app/static/admin.js?v=__V__"></script>
</body>
</html>
