<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giveaway</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --page: #8fbf72;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7385;
    --accent: #3a9b5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(90% 60% at 50% 25%, #d4e8c4 0%, var(--page) 70%) fixed, var(--page);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 400px; min-height: 270px;
    background: var(--card); border-radius: 18px;
    box-shadow: 0 12px 40px rgba(30, 60, 20, 0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 24px 30px; text-align: center;
  }
  .dice { width: 96px; height: 96px; margin-bottom: 18px; }
  .rolling .dice { animation: roll 0.9s ease-in-out infinite; }
  @keyframes roll {
    0% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(180deg) translateY(-8px); }
    100% { transform: rotate(360deg) translateY(0); }
  }
  .pop .dice { animation: pop 0.5s ease-out; }
  @keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .msg { font-size: 17px; font-weight: 600; line-height: 1.4; margin: 0; }
  .sub { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 22px; }
  .actions:empty { display: none; }
  .btn {
    display: block; width: 100%; padding: 13px 16px; border: 0; border-radius: 12px;
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: #eef3ea; color: var(--accent); }
</style>
</head>
<body>
<main class="card rolling" id="card">
  <svg class="dice" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="50" cy="92" rx="34" ry="5" fill="rgba(0,0,0,0.12)"/>
    <rect x="12" y="10" width="76" height="76" rx="18" fill="#c9ccd6"/>
    <rect x="12" y="6" width="76" height="74" rx="18" fill="#f4f5f8" stroke="#9aa0ae" stroke-width="2.5"/>
    <circle cx="32" cy="26" r="6.5" fill="#22252d"/>
    <circle cx="50" cy="43" r="6.5" fill="#22252d"/>
    <circle cx="68" cy="60" r="6.5" fill="#e5322d"/>
    <circle cx="32" cy="60" r="6.5" fill="#22252d"/>
    <circle cx="68" cy="26" r="6.5" fill="#22252d"/>
  </svg>
  <p class="msg" id="msg">…</p>
  <p class="sub" id="sub"></p>
  <div class="actions" id="actions"></div>
</main>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var card = document.getElementById("card");
  var msg = document.getElementById("msg");
  var sub = document.getElementById("sub");
  var actions = document.getElementById("actions");
  if (tg) { tg.ready(); tg.expand(); }
  var initData = tg ? tg.initData : "";
  var unsafe = tg ? tg.initDataUnsafe || {} : {};
  var start = unsafe.start_param || new URLSearchParams(location.search).get("gw") || "";
  if (start && start.indexOf("gw") !== 0) start = "gw" + start;

  function button(label, cls, onClick) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn " + cls; b.textContent = label;
    b.addEventListener("click", onClick);
    actions.appendChild(b);
  }

  function show(data) {
    card.classList.remove("rolling");
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
    msg.textContent = data.text || "";
    sub.textContent = data.channel || "";
    actions.innerHTML = "";
    if (data.status === "joined" && tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if (data.status === "subscribe") {
      button(data.open_label, "btn-primary", function () {
        if (tg) tg.openTelegramLink(data.channel_url); else location.href = data.channel_url;
      });
      button(data.retry_label, "btn-ghost", enter);
    }
  }

  function enter() {
    card.classList.add("rolling");
    actions.innerHTML = "";
    fetch("/api/giveaway/join", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "tma " + initData },
      body: JSON.stringify({ start: start })
    }).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(show).catch(function () {
      var uk = /^(uk|ru|be)/.test((unsafe.user && unsafe.user.language_code) || "uk");
      show({ status: "error", text: uk ? "😕 Не вдалося зв'язатися з ботом. Спробуйте ще раз." : "😕 Couldn't reach the bot. Please try again." });
      button(uk ? "🔄 Ще раз" : "🔄 Try again", "btn-ghost", enter);
    });
  }

  enter();
})();
</script>
</body>
</html>
