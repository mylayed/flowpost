services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowpost
      POSTGRES_PASSWORD: flowpost
      POSTGRES_DB: flowpost
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://flowpost:flowpost@postgres:5432/flowpost
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  pgdata:
